# Build APK debug la fiecare push pe main + Release cu APK la tag-uri v*.
# Semnătura e stabilă (android/app/debug.keystore comis în repo), iar versionCode
# începe de la 100 (migrare de pe repo-ul vechi) și crește cu fiecare build —
# update-urile OTA se instalează peste versiunea veche.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependente web
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Versiune + versionCode
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          grep -E "version(Code|Name)" android/app/build.gradle
          npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: starforge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starforge-apk
          path: apk

      - name: version.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          jq -n \
            --arg version "$VER" \
            --argjson build "$((100 + ${{ github.run_number }}))" \
            --arg notes "STARFORGE $TAG — vezi changelog-ul release-ului." \
            '{version:$version, build:$build, apk:"app-debug.apk", notes:$notes}' \
            > apk/version.json
          cat apk/version.json

      - name: Publică Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/app-debug.apk
            apk/version.json
          generate_release_notes: true
